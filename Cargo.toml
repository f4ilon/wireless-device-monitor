[package]
name = "wireless_monitor"
version = "0.1.0"
edition = "2024"

[features]
# GUI (окно egui + системный трей) собирается только под Windows.
default = ["gui"]
gui = []

[dependencies]
hidapi = "2.6.7"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Networking_Sockets",
    "Foundation_Collections",
    "Storage_Streams",
] }
windows-future = "0.3.2"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(windows)'.dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true